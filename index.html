<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerLearn Hub Shorts</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* रील्स फीड - फुल स्क्रीन स्नैप स्क्रॉल */
        .reels-feed {
            width: 100%;
            max-width: 450px; /* मोबाइल स्क्रीन साइज */
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* स्क्रॉल बार छुपाने के लिए */
        }
        .reels-feed::-webkit-scrollbar { display: none; } /* क्रोम के लिए स्क्रॉल बार छुपाएं */
        
        /* हर एक रील कार्ड */
        .reel-card {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background: #000;
        }
        .reel-card iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="reels-feed">
        
        <!-- 🎬 पहली रील (आपकी पहली गूगल ड्राइव वीडियो) -->
        <div class="reel-card">
            <iframe src="https://google.com" allow="autoplay" allowfullscreen></iframe>
        </div>
        
        <!-- 🎬 दूसरी रील (आपकी दूसरी गूगल ड्राइव वीडियो) -->
        <div class="reel-card">
            <iframe src="https://google.com" allow="autoplay" allowfullscreen></iframe>
        </div>

    </div>

</body>
</html>
