<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerLearn Hub Shorts</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .reels-feed { width: 100%; max-width: 450px; height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .reels-feed::-webkit-scrollbar { display: none; }
        .reel-card { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; background: #000; }
        .reel-card iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="reels-feed">
        <!-- 🎬 पहली रील (यूट्यूब का ऑफिशियल एम्बेड प्लेयर फॉर्मेट) -->
        <div class="reel-card">
            <iframe src="https://youtube.com" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <!-- 🎬 दूसरी रील (वही सेम वीडियो टेस्ट के लिए) -->
        <div class="reel-card">
            <iframe src="https://youtube.com" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
