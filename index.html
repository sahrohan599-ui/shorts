<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerTube Premium Feed</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .reels-feed { width: 100%; max-width: 450px; height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; position: relative; }
        .reels-feed::-webkit-scrollbar { display: none; }
        .reel-card { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; background: #000; }
        .reel-card video { width: 100%; height: 100%; object-fit: cover; }
        
        .instagram-style-overlay {
            position: absolute; bottom: 30px; left: 15px; right: 80px;
            background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px; border-radius: 16px; color: #ffffff; font-family: Arial, sans-serif; z-index: 5;
        }
        .creator-name { font-weight: bold; font-size: 14px; display: block; margin-bottom: 4px; }
        .video-desc { font-size: 12px; color: #f0f0f0; }
        
        .social-sidebar { position: absolute; right: 15px; bottom: 60px; display: flex; flex-direction: column; gap: 15px; align-items: center; z-index: 5; }
        .btn-box { display: flex; flex-direction: column; align-items: center; color: white; font-family: Arial; font-size: 11px; cursor: pointer; }
        .circle-btn { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; width: 48px; height: 48px; display: flex; justify-content: center; align-items: center; font-size: 22px; transition: 0.2s; margin-bottom: 4px; }
        .circle-btn:active { transform: scale(0.9); }
        .liked { color: #ff0055 !important; background: white; }

        .comment-section-popup {
            position: absolute; bottom: 0; left: 0; right: 0; height: 50vh; background: rgba(20, 20, 20, 0.98); backdrop-filter: blur(20px);
            border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 20; padding: 20px; color: white; font-family: Arial; display: none; flex-direction: column;
        }
        .comment-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .close-popup { cursor: pointer; color: #ff0055; }
        .comments-list { flex: 1; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 10px; }
        .comment-item { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 10px; }
        .comment-input-box { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .comment-input-box input { background: #222; border: 1px solid #444; border-radius: 20px; padding: 8px 15px; color: white; font-size: 12px; }
        .comment-input-box button { background: #ff0055; border: none; color: white; border-radius: 20px; padding: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="reels-feed" id="peerTubeFeed"></div>

    <div class="comment-section-popup" id="commentPopup">
        <div class="comment-header"><span>💬 PeerTube Replies</span><span class="close-popup" id="closePopup">✕</span></div>
        <div class="comments-list" id="commentsList"></div>
        <div class="comment-input-box">
            <div style="display: flex; gap: 8px;">
                <input type="text" id="cName" placeholder="Real Name" style="width: 50%;">
                <input type="text" id="cInsta" placeholder="Instagram ID" style="width: 50%;">
            </div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="cInput" placeholder="Write a reply or answer..." style="flex: 1;">
                <button id="cBtn">Send</button>
            </div>
        </div>
    </div>

    <!-- 🔗 यह फाइल आपका क्रिएटर डेटा लाएगी -->
    <script src="data.js"></script>
    <script>
        // वीडियो नाम के नंबर के हिसाब से ऑटो सॉर्ट (Newest First)
        videoDatabase.sort((a, b) => b.videoFile.localeCompare(a.videoFile, undefined, {numeric: true, sensitivity: 'base'}));

        // ⚠️ यहाँ अपनी असली Google Web App URL पेस्ट कर दो 
        const scriptUrl = "https://script.google.com/macros/s/AKfycbzOM6jZbgLcCcUeAwI8Gp977I4oNaYbaKTBatRhsDs9Xlg4Y4sz8N2bzS0In9tE9k0/exec"; 

        const feedContainer = document.getElementById('peerTubeFeed');
        let activeVideo = ""; let activeCreator = "";

        // पेज लोड होते ही पुरानी डिटेल्स ऑटो-भरना
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('pName')) document.getElementById('cName').value = localStorage.getItem('pName');
            if(localStorage.getItem('pInsta')) document.getElementById('cInsta').value = localStorage.getItem('pInsta');
        });

        videoDatabase.forEach(data => {
            const card = document.createElement('div');
            card.className = 'reel-card';
            card.innerHTML = `
                <video src="${data.videoFile}" autoplay muted loop playsinline></video>
                <div class="instagram-style-overlay">
                    <span class="creator-name">${data.creatorName} • ${data.instagramID}</span>
                    <div class="video-desc">${data.description} <b>${data.hashtags}</b></div>
                </div>
                <div class="social-sidebar">
                    <div class="btn-box id-like"><div class="circle-btn">❤️</div><span>Like</span></div>
                    <div class="btn-box id-comment"><div class="circle-btn">💬</div><span>Reply</span></div>
                </div>
            `;

            // ❤️ लाइक ट्रैकर
            const heart = card.querySelector('.id-like .circle-btn');
            card.querySelector('.id-like').addEventListener('click', () => {
                heart.classList.toggle('liked');
                var type = heart.classList.contains('liked') ? "like" : "unlike";
                fetch(`${scriptUrl}?video=${data.videoFile}&creator=${data.creatorName}&action=${type}`);
            });

            // 💬 कमेंट्स ट्रिगर
            card.querySelector('.id-comment').addEventListener('click', () => {
                activeVideo = data.videoFile; activeCreator = data.creatorName;
                document.getElementById('commentPopup').style.display = 'flex';
                document.getElementById('commentsList').innerHTML = "<div class='comment-item'>Discussions are open...</div>";
            });

            // 📊 ऑटोमैटिक व्यू काउंट ट्रैकर (वीडियो प्ले होते ही शीट में डेटा जाएगा)
            card.querySelector('video').addEventListener('play', () => {
                fetch(`${scriptUrl}?video=${data.videoFile}&creator=${data.creatorName}&action=view`);
            });

            feedContainer.appendChild(card);
        });

        document.getElementById('closePopup').addEventListener('click', () => { document.getElementById('commentPopup').style.display = 'none'; });

        // कमेंट सेंड और मेमोरी में सेव करने का लॉजिक
        document.getElementById('cBtn').addEventListener('click', () => {
            var name = document.getElementById('cName').value.trim();
            var insta = document.getElementById('cInsta').value.trim();
            var txt = document.getElementById('cInput').value.trim();
            if(!name || !insta || !txt) return alert("कृपया सभी कॉलम भरें!");
            
            localStorage.setItem('pName', name); localStorage.setItem('pInsta', insta);
            var fullComment = `Name: ${name} | Insta: ${insta} | Msg: ${txt}`;
            fetch(`${scriptUrl}?video=${activeVideo}&creator=${activeCreator}&action=comment&comment=${encodeURIComponent(fullComment)}`);
            
            const item = document.createElement('div'); item.className = 'comment-item';
            item.innerHTML = `<b>${name} (${insta}):</b> ${txt}`;
            document.getElementById('commentsList').appendChild(item);
            document.getElementById('cInput').value = "";
        });
    </script>
</body>
</html>
